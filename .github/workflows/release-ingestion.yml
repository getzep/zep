# Releases the zep-ingest package (ingestion/) to PyPI.
# Tag scheme: zep-ingest-v<version>  (e.g. zep-ingest-v0.1.0)
# Distinct from the integrations tag scheme (zep-<framework>-<language>-v<version>).

name: Release Ingestion Package

on:
  workflow_dispatch:

concurrency:
  group: release-zep-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: release
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Ingestion releases must be dispatched from main (got '$GITHUB_REF')." >&2
            exit 1
          fi
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("ingestion/pyproject.toml", "rb"))["project"]["version"])')"
          RELEASE_TAG="zep-ingest-v$VERSION"

          if [[ ! "$RELEASE_TAG" =~ ^zep-ingest-v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must match zep-ingest-v<version>" >&2
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"

          TAG_REF="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$TAG_REF" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              echo "release tag resolves to $TAG_SHA, but the release source is $HEAD_SHA" >&2
              exit 1
            fi
          fi

          {
            echo "sha=$HEAD_SHA"
            echo "tag=$RELEASE_TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Archive resolved source
        run: git archive --format=tar "${{ steps.release.outputs.sha }}" > release-source.tar
      - name: Upload resolved source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-source
          path: release-source.tar
          if-no-files-found: error

  test:
    needs: resolve-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ingestion
    steps:
      - name: Download resolved source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source
          path: .
      - name: Extract resolved source
        working-directory: .
        run: tar -xf release-source.tar
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.7.19"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/
          uv run pytest tests/ -v -m "not integration"

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          package_version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$package_version" = "$EXPECTED_VERSION"

  build:
    needs: [resolve-release, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download resolved source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-source
          path: .
      - name: Extract resolved source
        run: tar -xf release-source.tar
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.7.19"
      - name: Set up Python
        run: uv python install 3.11
      - name: Build package
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
        working-directory: ingestion
        run: |
          package_version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$package_version" = "$EXPECTED_VERSION"
          uv build
          uvx twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ingestion-dist
          path: ingestion/dist/

  publish-pypi:
    needs: [resolve-release, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the tag and GitHub Release on manual runs
      id-token: write # required for PyPI trusted publishing (OIDC)
    environment:
      name: release
      url: https://pypi.org/p/zep-ingest
    steps:
      # Publish before creating the tag/release so a failed upload cannot leave an
      # orphaned tag that blocks the next dispatch after main moves forward.
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ingestion-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          fetch-depth: 0
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          TAG_EXISTS=false
          TAG_REF="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$TAG_REF" ]]; then
            TAG_EXISTS=true
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "Tag '$RELEASE_TAG' already points to $TAG_SHA, not $RELEASE_SHA." >&2
              exit 1
            fi
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists at the validated commit; continuing."
          else
            RELEASE_ARGS=(
              "$RELEASE_TAG"
              --title "zep-ingest v$VERSION"
              --generate-notes
            )
            if [[ "$TAG_EXISTS" == "true" ]]; then
              RELEASE_ARGS+=(--verify-tag)
            else
              RELEASE_ARGS+=(--target "$RELEASE_SHA")
            fi
            gh release create "${RELEASE_ARGS[@]}"
          fi
