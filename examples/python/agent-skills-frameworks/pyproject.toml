[project]
name = "agent-skills-frameworks"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.78,<1",
    "claude-agent-sdk==0.2.178",
    "google-adk==2.13.0",
    "httpx>=0.28,<0.29",
    "langchain==1.4.8",
    "langchain-anthropic==1.7.9",
    "langchain-openai==1.7.3",
    "langgraph==1.2.19",
    "pydantic>=2.11,<3",
    "zep-cloud==4.1.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "pyright>=1.1.390"]

[tool.uv]
# google-adk 2.13.0 caps opentelemetry at <=1.44; 1.45.1 fixes GHSA-xcq7-p3pf-p88h. Remove when google-adk lifts the cap.
override-dependencies = ["opentelemetry-api>=1.45.1", "opentelemetry-sdk>=1.45.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
include = ["adk_agent.py", "banking.py", "claude_agent_sdk_agent.py", "episode.py", "langgraph_agent.py", "prompts.py", "run.py", "tools.py", "zep_skills.py", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
