[project]
name = "alfworld-agent-skills"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alfworld==0.4.2",
    "httpx==0.28.1",
    "zep-cloud==4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]
modal = [
    "modal>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
